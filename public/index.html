<!doctype html>
<html lang="de">
<head>

<title>Garagenverwaltung</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23233041'/><path d='M6 14 16 7l10 7v11H6z' fill='%23e8a33d'/><path d='M10 16h12M10 19h12M10 22h12' stroke='%23233041' stroke-width='1.6'/></svg>">

  <nav id="tabs">

    <button data-view="garagen">Garagen</button>
    <button data-view="mieter">Mieter</button>
    <button data-view="vertraege">Verträge</button>
